name: NextJS

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  # Codecov authenticates the upload with a GitHub OIDC token, not a secret.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # CI=true turns on coverage -- see jest.config.mjs.
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Reporting, not a gate: a Codecov outage must not block a merge.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage/lcov.info
          fail_ci_if_error: false

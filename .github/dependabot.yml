version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - major

  # Unlike the actions above, whose tags float within a major, npm pins exact
  # versions, so minor and patch releases need PRs too. They come grouped into
  # one, and each major on its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
